<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MindFlow — Paiement</title>

  <meta
    name="description"
    content="Paiement sécurisé de votre commande MindFlow."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #111827;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 30px 18px 60px;
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 25px;
      color: #111827;
    }

    .logo span {
      color: #2563eb;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .subtitle {
      color: #6b7280;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .product {
      background: #f8fafc;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 25px;
    }

    .product-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .product-price {
      font-size: 24px;
      font-weight: 800;
      color: #2563eb;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .methods {
      display: grid;
      gap: 12px;
      margin-top: 10px;
    }

    .method {
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: 0.2s;
    }

    .method:hover {
      border-color: #2563eb;
      background: #f8fbff;
    }

    .method input {
      width: auto;
      margin: 0;
    }

    .method-name {
      font-weight: 700;
    }

    .method-description {
      font-size: 13px;
      color: #6b7280;
      margin-top: 3px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      background: #2563eb;
      color: white;
      transition: 0.2s;
      margin-top: 10px;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    .message {
      display: none;
      border-radius: 12px;
      padding: 15px;
      margin-top: 20px;
      line-height: 1.5;
    }

    .message.success {
      display: block;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .message.info {
      display: block;
      background: #eff6ff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }

    .order-details {
      margin-top: 15px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 10px;
      padding: 12px;
    }

    .order-details div {
      margin-bottom: 7px;
      word-break: break-word;
    }

    .order-details div:last-child {
      margin-bottom: 0;
    }

    .secure {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      margin-top: 15px;
    }

    .loading {
      display: inline-block;
      width: 17px;
      height: 17px;
      border: 2px solid rgba(255,255,255,0.5);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px 12px 40px;
      }

      .card {
        padding: 20px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      Mind<span>Flow</span>
    </div>

    <div class="card">

      <h1>Finaliser votre commande</h1>

      <p class="subtitle">
        Remplissez vos informations puis choisissez votre moyen de paiement.
      </p>

      <div class="product">

        <div
          id="productName"
          class="product-name"
        >
          Chargement du produit...
        </div>

        <div
          id="productPrice"
          class="product-price"
        >
          --
        </div>

      </div>

      <form id="paymentForm">

        <div class="form-group">

          <label for="customerName">
            Nom complet
          </label>

          <input
            type="text"
            id="customerName"
            placeholder="Votre nom complet"
            required
          >

        </div>

        <div class="form-group">

          <label for="customerEmail">
            Adresse e-mail
          </label>

          <input
            type="email"
            id="customerEmail"
            placeholder="exemple@email.com"
            required
          >

        </div>

        <div class="form-group">

          <label for="customerPhone">
            Numéro de téléphone
          </label>

          <input
            type="tel"
            id="customerPhone"
            placeholder="Ex : 077000000"
            required
          >

        </div>

        <div class="form-group">

          <label>
            Moyen de paiement
          </label>

          <div class="methods">

            <label class="method">

              <input
                type="radio"
                name="paymentMethod"
                value="airtel"
                checked
              >

              <div>
                <div class="method-name">
                  Airtel Money
                </div>

                <div class="method-description">
                  Paiement mobile avec Airtel Money
                </div>
              </div>

            </label>

            <label class="method">

              <input
                type="radio"
                name="paymentMethod"
                value="moov"
              >

              <div>
                <div class="method-name">
                  Moov Money
                </div>

                <div class="method-description">
                  Paiement mobile avec Moov Money
                </div>
              </div>

            </label>

          </div>

        </div>

        <button
          type="submit"
          id="payButton"
        >
          Payer maintenant
        </button>

      </form>

      <div
        id="message"
        class="message"
      ></div>

      <div class="secure">
        🔒 Vos informations sont transmises de manière sécurisée.
      </div>

    </div>

  </div>


<script>

  /*
   * ==========================================================
   * CONFIGURATION SUPABASE
   * ==========================================================
   */

  const SUPABASE_URL =
    "https://ejjmluesrrrbktgstlqm.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_cZFXtvFhhdnwip0SDDJArg_ofylyowI";


  /*
   * ==========================================================
   * EDGE FUNCTION E-BILLING
   * ==========================================================
   */

  const EBILLING_FUNCTION_URL =
    `${SUPABASE_URL}/functions/v1/create-ebilling-payment`;


  /*
   * ==========================================================
   * VARIABLES
   * ==========================================================
   */

  let currentProduct = null;


  /*
   * ==========================================================
   * ELEMENTS HTML
   * ==========================================================
   */

  const productNameElement =
    document.getElementById("productName");

  const productPriceElement =
    document.getElementById("productPrice");

  const paymentForm =
    document.getElementById("paymentForm");

  const payButton =
    document.getElementById("payButton");

  const messageElement =
    document.getElementById("message");


  /*
   * ==========================================================
   * MESSAGE
   * ==========================================================
   */

  function showMessage(
    message,
    type = "info"
  ) {

    messageElement.className =
      `message ${type}`;

    messageElement.innerHTML =
      message;

    messageElement.style.display =
      "block";
  }


  function hideMessage() {

    messageElement.className =
      "message";

    messageElement.innerHTML =
      "";

    messageElement.style.display =
      "none";
  }


  /*
   * ==========================================================
   * FORMAT PRIX
   * ==========================================================
   */

  function formatPrice(price) {

    return new Intl.NumberFormat(
      "fr-FR"
    ).format(Number(price)) + " FCFA";

  }


  /*
   * ==========================================================
   * RÉCUPÉRATION DU PRODUIT
   * ==========================================================
   *
   * La page attend par exemple :
   *
   * paiement.html?id=UUID_DU_PRODUIT
   *
   */

  function getProductIdFromUrl() {

    const params =
      new URLSearchParams(
        window.location.search
      );

    return params.get("id");

  }


  /*
   * ==========================================================
   * CHARGER LE PRODUIT
   * ==========================================================
   */

  async function loadProduct() {

    const productId =
      getProductIdFromUrl();


    if (!productId) {

      throw new Error(
        "Aucun produit n'a été sélectionné."
      );

    }


    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/products?id=eq.${encodeURIComponent(productId)}&select=*`,
        {
          method: "GET",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              `Bearer ${SUPABASE_KEY}`
          }
        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "Erreur récupération produit :",
        errorText
      );

      throw new Error(
        "Impossible de récupérer le produit."
      );

    }


    const products =
      await response.json();


    if (
      !Array.isArray(products) ||
      products.length === 0
    ) {

      throw new Error(
        "Produit introuvable."
      );

    }


    currentProduct =
      products[0];


    /*
     * Affichage
     */

    productNameElement.textContent =
      currentProduct.name ||
      currentProduct.title ||
      "Produit MindFlow";


    productPriceElement.textContent =
      formatPrice(
        currentProduct.price
      );

  }


  /*
   * ==========================================================
   * CRÉER LA COMMANDE
   * ==========================================================
   *
   * CORRECTION IMPORTANTE :
   *
   * 1. L'UUID est créé ici côté navigateur.
   *
   * 2. On utilise return=minimal.
   *
   * Cela évite que Supabase essaie de retourner
   * la ligne créée alors qu'une politique SELECT
   * publique n'existe pas sur orders.
   *
   * On ne crée donc PAS de SELECT public sur orders.
   *
   */

  async function createOrder(
    customerData
  ) {

    /*
     * Création de l'ID avant insertion
     */

    const orderId =
      crypto.randomUUID();


    const order = {

      id:
        orderId,

      product_id:
        currentProduct.id,

      customer_name:
        customerData.name,

      customer_email:
        customerData.email,

      customer_phone:
        customerData.phone,

      amount:
        Number(currentProduct.price),

      status:
        "pending"

    };


    console.log(
      "Création commande :",
      order
    );


    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/orders`,
        {
          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${SUPABASE_KEY}`,

            /*
             * IMPORTANT :
             * Ne pas utiliser return=representation.
             */

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify(order)

        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();


      console.error(
        "Erreur création commande :",
        errorText
      );


      let errorMessage =
        "Impossible de créer la commande.";


      try {

        const errorData =
          JSON.parse(errorText);


        errorMessage =
          errorData.message ||
          errorData.error_description ||
          errorData.hint ||
          errorData.details ||
          errorMessage;

      }
      catch (_) {
        /*
         * La réponse n'est pas forcément
         * du JSON.
         */
      }


      throw new Error(
        errorMessage
      );

    }


    /*
     * Comme return=minimal est utilisé,
     * Supabase ne renvoie pas la ligne.
     *
     * Mais nous avons déjà l'objet order
     * complet avec son UUID.
     */

    return order;

  }


  /*
   * ==========================================================
   * CRÉER LA FACTURE E-BILLING
   * ==========================================================
   */

  async function createEBillingInvoice(
    orderId
  ) {

    console.log(
      "Création facture E-Billing pour :",
      orderId
    );


    const response =
      await fetch(
        EBILLING_FUNCTION_URL,
        {
          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${SUPABASE_KEY}`

          },

          body:
            JSON.stringify({
              order_id:
                orderId
            })

        }
      );


    const responseText =
      await response.text();


    console.log(
      "Réponse E-Billing :",
      responseText
    );


    let data = null;


    try {

      data =
        JSON.parse(
          responseText
        );

    }
    catch (_) {

      data = null;

    }


    if (!response.ok) {

      const errorMessage =
        data?.message ||
        data?.error ||
        responseText ||
        "Erreur lors de la création de la facture E-Billing.";

      throw new Error(
        errorMessage
      );

    }


    if (
      !data ||
      data.success !== true
    ) {

      throw new Error(
        data?.message ||
        "La facture E-Billing n'a pas pu être créée."
      );

    }


    return data;

  }


  /*
   * ==========================================================
   * SOUMISSION DU FORMULAIRE
   * ==========================================================
   */

  paymentForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      hideMessage();


      if (!currentProduct) {

        showMessage(
          "Le produit n'est pas encore chargé. Veuillez patienter.",
          "error"
        );

        return;

      }


      /*
       * Récupération des informations
       */

      const name =
        document
          .getElementById(
            "customerName"
          )
          .value
          .trim();


      const email =
        document
          .getElementById(
            "customerEmail"
          )
          .value
          .trim();


      const phone =
        document
          .getElementById(
            "customerPhone"
          )
          .value
          .trim();


      const paymentMethodElement =
        document.querySelector(
          'input[name="paymentMethod"]:checked'
        );


      const paymentMethod =
        paymentMethodElement
          ? paymentMethodElement.value
          : null;


      /*
       * Vérifications
       */

      if (!name) {

        showMessage(
          "Veuillez entrer votre nom complet.",
          "error"
        );

        return;

      }


      if (!email) {

        showMessage(
          "Veuillez entrer votre adresse e-mail.",
          "error"
        );

        return;

      }


      if (!phone) {

        showMessage(
          "Veuillez entrer votre numéro de téléphone.",
          "error"
        );

        return;

      }


      if (!paymentMethod) {

        showMessage(
          "Veuillez sélectionner un moyen de paiement.",
          "error"
        );

        return;

      }


      /*
       * Désactiver le bouton
       */

      payButton.disabled =
        true;


      payButton.innerHTML =
        `<span class="loading"></span>Traitement en cours...`;


      try {

        /*
         * ==================================================
         * ÉTAPE 1
         * Créer la commande
         * ==================================================
         */

        const order =
          await createOrder({

            name:
              name,

            email:
              email,

            phone:
              phone

          });


        console.log(
          "Commande créée :",
          order
        );


        /*
         * ==================================================
         * ÉTAPE 2
         * Création facture E-Billing
         * ==================================================
         */

        showMessage(
          "Commande créée. Création de votre facture de paiement...",
          "info"
        );


        const billing =
          await createEBillingInvoice(
            order.id
          );


        console.log(
          "Facture E-Billing créée :",
          billing
        );


        /*
         * ==================================================
         * SUCCÈS
         * ==================================================
         */

        const selectedMethod =
          paymentMethod === "airtel"
            ? "Airtel Money"
            : "Moov Money";


        showMessage(

          `
            <strong>Commande enregistrée avec succès.</strong>

            <div class="order-details">

              <div>
                <strong>Produit :</strong>
                ${escapeHtml(
                  currentProduct.name ||
                  currentProduct.title ||
                  "Produit MindFlow"
                )}
              </div>

              <div>
                <strong>Montant :</strong>
                ${formatPrice(
                  currentProduct.price
                )}
              </div>

              <div>
                <strong>Moyen :</strong>
                ${escapeHtml(
                  selectedMethod
                )}
              </div>

              <div>
                <strong>Commande :</strong>
                ${escapeHtml(
                  order.id
                )}
              </div>

              <div>
                <strong>Facture E-Billing :</strong>
                ${escapeHtml(
                  String(
                    billing.bill_id
                  )
                )}
              </div>

              <div>
                <strong>État de la facture :</strong>
                ${escapeHtml(
                  String(
                    billing.state ||
                    "ready"
                  )
                )}
              </div>

            </div>

            <br>

            <strong>
              Votre facture a été créée.
            </strong>

            <br>

            Le paiement Mobile Money sera traité à l'étape suivante.
          `,

          "success"

        );


        /*
         * Pour le moment, on ne dit PAS "paiement réussi".
         *
         * "ready" signifie que la facture est prête.
         * Le vrai paiement Airtel/Moov sera ajouté ensuite.
         */

        payButton.disabled =
          true;


        payButton.textContent =
          "Commande enregistrée";


      }
      catch (error) {

        console.error(
          "Erreur paiement :",
          error
        );


        showMessage(

          `
            <strong>Une erreur est survenue.</strong>
            <br><br>
            ${escapeHtml(
              error.message ||
              "Impossible de traiter votre commande."
            )}
          `,

          "error"

        );


        /*
         * Réactiver le bouton
         */

        payButton.disabled =
          false;


        payButton.textContent =
          "Réessayer le paiement";

      }

    }
  );


  /*
   * ==========================================================
   * PROTECTION AFFICHAGE HTML
   * ==========================================================
   */

  function escapeHtml(
    value
  ) {

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /*
   * ==========================================================
   * INITIALISATION
   * ==========================================================
   */

  async function init() {

    try {

      await loadProduct();

    }
    catch (error) {

      console.error(
        "Erreur initialisation :",
        error
      );


      productNameElement.textContent =
        "Produit indisponible";


      productPriceElement.textContent =
        "";


      showMessage(
        error.message ||
        "Impossible de charger le produit.",
        "error"
      );


      payButton.disabled =
        true;

    }

  }


  /*
   * Lancement
   */

  init();

</script>

</body>
</html>
