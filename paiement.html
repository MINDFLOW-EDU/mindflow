<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Paiement — MindFlow</title>
  <meta
    name="description"
    content="Finalisez votre commande sur MindFlow."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
      min-height: 100vh;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #111827;
    }

    .back-btn {
      text-decoration: none;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .page-title {
      text-align: center;
      margin-bottom: 30px;
    }

    .page-title h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .page-title p {
      color: #6b7280;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    .category {
      display: inline-block;
      background: #eef2ff;
      color: #4f46e5;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .product-title {
      font-size: 25px;
      margin-bottom: 12px;
    }

    .description {
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .price {
      font-size: 28px;
      font-weight: 800;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #4f46e5;
    }

    .payment-methods {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .payment-option {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 13px;
      cursor: pointer;
    }

    .payment-option input {
      width: auto;
    }

    .payment-option span {
      font-weight: 600;
    }

    button {
      width: 100%;
      border: none;
      background: #111827;
      color: white;
      padding: 15px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #000000;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .notice {
      margin-top: 18px;
      padding: 13px;
      background: #f3f4f6;
      border-radius: 10px;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.5;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.success {
      display: block;
      background: #ecfdf5;
      color: #047857;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: #b91c1c;
    }

    @media (max-width: 700px) {
      main {
        margin: 25px auto;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .page-title h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">MindFlow</div>

    <a href="javascript:history.back()" class="back-btn">
      ← Retour
    </a>
  </div>
</header>

<main>

  <div class="page-title">
    <h1>Finaliser votre commande</h1>
    <p>Remplissez vos informations pour continuer.</p>
  </div>

  <div class="grid">

    <!-- PRODUIT -->
    <div class="card">

      <div id="productLoading">
        Chargement du produit...
      </div>

      <div id="productContent" style="display:none;">

        <div class="category" id="productCategory"></div>

        <h2 class="product-title" id="productTitle"></h2>

        <p class="description" id="productDescription"></p>

        <div class="price" id="productPrice"></div>

      </div>

    </div>


    <!-- FORMULAIRE -->
    <div class="card">

      <form id="paymentForm">

        <div class="form-group">
          <label for="customerName">
            Nom complet
          </label>

          <input
            type="text"
            id="customerName"
            placeholder="Votre nom complet"
            required
          >
        </div>


        <div class="form-group">
          <label for="customerEmail">
            Adresse e-mail
          </label>

          <input
            type="email"
            id="customerEmail"
            placeholder="exemple@email.com"
            required
          >
        </div>


        <div class="form-group">
          <label for="customerPhone">
            Numéro de téléphone
          </label>

          <input
            type="tel"
            id="customerPhone"
            placeholder="07 XX XX XX XX"
            required
          >
        </div>


        <div class="form-group">

          <label>
            Moyen de paiement
          </label>

          <div class="payment-methods">

            <label class="payment-option">
              <input
                type="radio"
                name="paymentMethod"
                value="airtel_money"
                required
              >

              <span>Airtel Money</span>
            </label>


            <label class="payment-option">
              <input
                type="radio"
                name="paymentMethod"
                value="moov_money"
                required
              >

              <span>Moov Money</span>
            </label>

          </div>

        </div>


        <button type="submit" id="submitButton">
          Continuer vers le paiement
        </button>


        <div id="message" class="message"></div>


        <div class="notice">
          Votre commande sera enregistrée avant le lancement du
          paiement. La connexion à E-Billing sera ajoutée dans
          l'étape suivante.
        </div>

      </form>

    </div>

  </div>

</main>


<script>

  const SUPABASE_URL =
    "https://ejjmluesrrrbktgstlqm.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_cZFXtvFhhdnwip0SDDJArg_ofylyowI";


  const params = new URLSearchParams(window.location.search);

  const productId = params.get("id");


  const productLoading =
    document.getElementById("productLoading");

  const productContent =
    document.getElementById("productContent");

  const productCategory =
    document.getElementById("productCategory");

  const productTitle =
    document.getElementById("productTitle");

  const productDescription =
    document.getElementById("productDescription");

  const productPrice =
    document.getElementById("productPrice");

  const paymentForm =
    document.getElementById("paymentForm");

  const submitButton =
    document.getElementById("submitButton");

  const message =
    document.getElementById("message");


  let currentProduct = null;


  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;
  }


  function formatPrice(price) {

    return new Intl.NumberFormat("fr-FR").format(price)
      + " FCFA";
  }


  async function loadProduct() {

    if (!productId) {

      productLoading.textContent =
        "Produit introuvable.";

      return;
    }


    try {

      const url =
        SUPABASE_URL +
        "/rest/v1/products" +
        "?select=id,title,description,price,category" +
        "&id=eq." +
        encodeURIComponent(productId) +
        "&is_active=eq.true";


      const response = await fetch(url, {

        headers: {

          "apikey": SUPABASE_KEY,

          "Authorization":
            "Bearer " + SUPABASE_KEY

        }

      });


      if (!response.ok) {
        throw new Error(
          "Impossible de charger le produit."
        );
      }


      const products = await response.json();


      if (!products.length) {

        productLoading.textContent =
          "Ce produit n'existe pas ou n'est plus disponible.";

        return;
      }


      currentProduct = products[0];


      productCategory.textContent =
        currentProduct.category || "Produit";

      productTitle.textContent =
        currentProduct.title;

      productDescription.textContent =
        currentProduct.description ||
        "Aucune description disponible.";

      productPrice.textContent =
        formatPrice(currentProduct.price);


      productLoading.style.display = "none";

      productContent.style.display = "block";


    } catch (error) {

      console.error(error);

      productLoading.textContent =
        "Une erreur est survenue lors du chargement du produit.";

    }

  }


  paymentForm.addEventListener("submit", async function(event) {

    event.preventDefault();


    if (!currentProduct) {

      showMessage(
        "Le produit n'est pas encore chargé.",
        "error"
      );

      return;
    }


    const customerName =
      document.getElementById("customerName").value.trim();

    const customerEmail =
      document.getElementById("customerEmail").value.trim();

    const customerPhone =
      document.getElementById("customerPhone").value.trim();


    const selectedMethod =
      document.querySelector(
        'input[name="paymentMethod"]:checked'
      );


    if (!selectedMethod) {

      showMessage(
        "Veuillez choisir un moyen de paiement.",
        "error"
      );

      return;
    }


    submitButton.disabled = true;

    submitButton.textContent =
      "Création de la commande...";

    message.className = "message";


    try {

      const order = {

        product_id: currentProduct.id,

        customer_name: customerName,

        customer_email: customerEmail,

        customer_phone: customerPhone,

        payment_method: selectedMethod.value,

        amount: Number(currentProduct.price),

        status: "pending"

      };


      const response = await fetch(

        SUPABASE_URL + "/rest/v1/orders",

        {

          method: "POST",

          headers: {

            "apikey": SUPABASE_KEY,

            "Authorization":
              "Bearer " + SUPABASE_KEY,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=representation"

          },

          body: JSON.stringify(order)

        }

      );


      if (!response.ok) {

        const errorData =
          await response.json().catch(() => null);

        console.error(
          "Erreur Supabase :",
          errorData
        );

        throw new Error(
          "Impossible de créer la commande."
        );
      }


      const createdOrders =
        await response.json();


      const createdOrder =
        createdOrders[0];


      showMessage(

        "Commande créée avec succès. Référence : "
        + createdOrder.id
        + ". Le paiement sera connecté à E-Billing à l'étape suivante.",

        "success"

      );


      submitButton.textContent =
        "Commande enregistrée";


    } catch (error) {

      console.error(error);

      showMessage(

        "Une erreur est survenue lors de la création de la commande. Vérifiez votre connexion puis réessayez.",

        "error"

      );


      submitButton.disabled = false;

      submitButton.textContent =
        "Continuer vers le paiement";

    }

  });


  loadProduct();

</script>

</body>
</html>
