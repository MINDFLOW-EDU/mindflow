
<script>
  /* =====================================================
     CONFIGURATION
  ===================================================== */

  const SUPABASE_URL =
    "https://ejjmluesrrrbktgstlqm.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_cZFXtvFhhdnwip0SDDJArg_ofylyowI";

  const CREATE_INVOICE_FUNCTION =
    `${SUPABASE_URL}/functions/v1/create-ebilling-payment`;

  let currentProduct = null;
  let currentOrderId = null;
  let isCheckingPayment = false;

  /* =====================================================
     UTILITAIRES
  ===================================================== */

  function showMessage(text, type = "info") {
    const box = document.getElementById("message");
    box.className = `message ${type}`;
    box.innerHTML = text;
  }

  function formatPrice(value) {
    return new Intl.NumberFormat("fr-FR")
      .format(Number(value || 0)) + " FCFA";
  }

  function normalizePhone(phone) {
    let value = String(phone || "")
      .trim()
      .replace(/[^\d+]/g, "");

    if (value.startsWith("+241")) {
      value = "0" + value.slice(4);
    } else if (value.startsWith("241")) {
      value = "0" + value.slice(3);
    }

    return value;
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  /* =====================================================
     LECTURE DU STATUT RÉEL DE LA COMMANDE
  ===================================================== */

  async function fetchOrderStatus(orderId) {
    const url =
      `${SUPABASE_URL}/rest/v1/orders` +
      `?id=eq.${encodeURIComponent(orderId)}` +
      `&select=id,status,payment_state,bill_id`;

    const response = await fetch(url, {
      method: "GET",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`
      },
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(
        `La vérification Supabase a échoué (HTTP ${response.status}).`
      );
    }

    const orders = await response.json();

    if (!Array.isArray(orders) || orders.length === 0) {
      throw new Error(
        "Commande introuvable ou lecture non autorisée."
      );
    }

    return orders[0];
  }

  function orderIsPaid(order) {
    return (
      String(order.status || "").toLowerCase() === "paid" ||
      String(order.payment_state || "").toLowerCase() === "paid"
    );
  }

  /* =====================================================
     AFFICHAGE DU RÉSULTAT VÉRIFIÉ
  ===================================================== */

  function displayVerifiedPayment(order) {
    showMessage(
      `
        <strong>Paiement confirmé !</strong><br><br>
        E-Billing a transmis la confirmation et
        MindFlow a enregistré votre commande comme payée.
      `,
      "success"
    );

    const details = document.getElementById("details");
    details.classList.remove("hidden");
    details.textContent =
      `Commande : ${order.id}\n` +
      `Statut : Paiement confirmé`;
  }

  function displayPendingPayment(orderId) {
    showMessage(
      `
        <strong>Paiement en attente de confirmation.</strong><br><br>
        Nous n'avons pas encore reçu la confirmation
        définitive d'E-Billing. Ne payez pas une deuxième fois
        avant d'avoir vérifié le statut de votre commande.<br><br>
        <button type="button" id="retryPaymentCheck">
          Vérifier à nouveau
        </button>
      `,
      "info"
    );

    const retryButton =
      document.getElementById("retryPaymentCheck");

    retryButton.addEventListener("click", () => {
      verifyReturnedPayment(true, orderId);
    });
  }

  /* =====================================================
     VÉRIFICATION APRÈS LE RETOUR D'E-BILLING
  ===================================================== */

  async function verifyReturnedPayment(
    retry = false,
    providedOrderId = null
  ) {
    if (isCheckingPayment) return;

    const params = new URLSearchParams(
      window.location.search
    );

    const payment = params.get("payment");
    const orderId =
      providedOrderId || params.get("order_id");

    if (!["success", "failed"].includes(payment)) {
      return;
    }

    if (!orderId) {
      showMessage(
        `
          <strong>Confirmation impossible.</strong><br><br>
          L'identifiant de votre commande manque dans
          l'adresse de retour. Aucun paiement ne sera
          considéré comme confirmé sans vérification.
        `,
        "error"
      );
      return;
    }

    isCheckingPayment = true;

    const retryButton =
      document.getElementById("retryPaymentCheck");

    if (retryButton) {
      retryButton.disabled = true;
      retryButton.textContent = "Vérification...";
    } else {
      showMessage(
        "Vérification du statut de votre commande...",
        "info"
      );
    }

    const details = document.getElementById("details");
    details.classList.remove("hidden");
    details.textContent = `Commande : ${orderId}`;

    try {
      /*
       * Si E-Billing indique un succès, on laisse un délai
       * au callback pour mettre à jour Supabase.
       * Le retour du navigateur ne constitue jamais la preuve.
       */
      const attempts =
        payment === "success" && !retry ? 6 : 1;

      let order = null;

      for (let i = 0; i < attempts; i++) {
        order = await fetchOrderStatus(orderId);

        if (orderIsPaid(order)) {
          displayVerifiedPayment(order);
          return;
        }

        if (i < attempts - 1) {
          await sleep(2000);
        }
      }

      if (payment === "failed") {
        showMessage(
          `
            <strong>Paiement non confirmé.</strong><br><br>
            Le portail a signalé un échec ou un abandon.
            La commande n'est pas enregistrée comme payée.
            Vous pouvez vérifier son statut à nouveau avant
            de tenter un autre paiement.
          `,
          "error"
        );

        details.textContent = `Commande : ${orderId}`;
        return;
      }

      displayPendingPayment(orderId);

    } catch (error) {
      console.error(
        "Vérification du paiement :",
        error
      );

      showMessage(
        `
          <strong>Statut du paiement indisponible.</strong><br><br>
          ${error.message}<br><br>
          Cela ne signifie pas nécessairement que le paiement
          a échoué. Vérifiez les règles d'accès Supabase et
          le statut de la commande avant de recommencer.
        `,
        "error"
      );

    } finally {
      isCheckingPayment = false;
    }
  }

  /* =====================================================
     CHARGEMENT DU PRODUIT
  ===================================================== */

  async function loadProduct() {
    const params = new URLSearchParams(
      window.location.search
    );

    /*
     * Priorité au retour E-Billing.
     * Pas besoin de l'identifiant du produit pour vérifier
     * une commande déjà créée.
     */
    if (params.has("payment")) {
      document.getElementById("productName").textContent =
        "Vérification de votre commande";

      document.getElementById("productDescription").textContent =
        "Nous vérifions la confirmation du paiement.";

      await verifyReturnedPayment();
      return;
    }

    const productId = params.get("id");

    if (!productId) {
      showMessage("Produit introuvable.", "error");
      return;
    }

    try {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/products?id=eq.${encodeURIComponent(productId)}&select=*`,
        {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`
          }
        }
      );

      if (!response.ok) {
        throw new Error("Impossible de charger le produit.");
      }

      const products = await response.json();

      if (!products.length) {
        throw new Error("Produit introuvable.");
      }

      currentProduct = products[0];

      document.getElementById("productName").textContent =
        currentProduct.name ||
        currentProduct.title ||
        "Produit MindFlow";

      document.getElementById("productPrice").textContent =
        formatPrice(currentProduct.price);

      document.getElementById("productDescription").textContent =
        currentProduct.description ||
        "Une ressource conçue pour apprendre, progresser et développer vos connaissances avec MindFlow.";

      document.getElementById("productCategory").textContent =
        currentProduct.category || "Ressource MindFlow";

    } catch (error) {
      console.error(error);
      showMessage(
        error.message || "Erreur lors du chargement du produit.",
        "error"
      );
    }
  }

  /* =====================================================
     CRÉATION DE LA COMMANDE
  ===================================================== */

  async function createOrder(customerData) {
    const order = {
      id: crypto.randomUUID(),
      product_id: currentProduct.id,
      customer_name: customerData.name,
      customer_email: customerData.email,
      customer_phone: customerData.phone,
      amount: Number(currentProduct.price),
      status: "pending"
    };

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/orders`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          Prefer: "return=minimal"
        },
        body: JSON.stringify(order)
      }
    );

    if (!response.ok) {
      const text = await response.text();

      throw new Error(
        `Impossible de créer la commande : ${text}`
      );
    }

    return order;
  }

  /* =====================================================
     CRÉATION DE LA FACTURE E-BILLING
  ===================================================== */

  async function createInvoice(orderId) {
    const response = await fetch(
      CREATE_INVOICE_FUNCTION,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        },
        body: JSON.stringify({
          order_id: orderId
        })
      }
    );

    const text = await response.text();
    let data;

    try {
      data = JSON.parse(text);
    } catch {
      data = { raw: text };
    }

    if (!response.ok || !data.success) {
      console.error("Erreur création facture :", data);

      throw new Error(
        data.message ||
        data.error ||
        "Impossible de créer la facture E-Billing."
      );
    }

    return data;
  }

  /* =====================================================
     CHOIX DU MODE DE PAIEMENT
  ===================================================== */

  const mobileMoneyOption =
    document.getElementById("mobileMoneyOption");

  const cardOption =
    document.getElementById("cardOption");

  mobileMoneyOption.addEventListener("click", function() {
    mobileMoneyOption.classList.add("active");
    cardOption.classList.remove("active");
  });

  cardOption.addEventListener("click", function(event) {
    event.preventDefault();

    showMessage(
      `
        <strong>Carte bancaire bientôt disponible.</strong><br><br>
        Pour le moment, MindFlow accepte les paiements
        via Mobile Money.
      `,
      "info"
    );
  });

  /* =====================================================
     SOUMISSION DU FORMULAIRE
  ===================================================== */

  document.getElementById("paymentForm")
    .addEventListener("submit", async function(event) {
      event.preventDefault();

      if (!currentProduct) {
        showMessage(
          "Le produit n'est pas encore chargé.",
          "error"
        );
        return;
      }

      const button = document.getElementById("payButton");

      const firstName = document
        .getElementById("customerFirstName")
        .value.trim();

      const lastName = document
        .getElementById("customerLastName")
        .value.trim();

      const email = document
        .getElementById("customerEmail")
        .value.trim();

      const phone = document
        .getElementById("customerPhone")
        .value.trim();

      if (!firstName || !lastName || !email || !phone) {
        showMessage(
          "Veuillez remplir tous les champs.",
          "error"
        );
        return;
      }

      const normalizedPhone = normalizePhone(phone);

      if (!/^0\d{8}$/.test(normalizedPhone)) {
        showMessage(
          "Veuillez entrer un numéro Mobile Money gabonais valide.",
          "error"
        );
        return;
      }

      try {
        button.disabled = true;
        button.innerHTML =
          '<span class="spinner"></span>Préparation...';

        showMessage(
          "Création de votre commande...",
          "info"
        );

        /*
         * 1. Créer la commande
         */
        const order = await createOrder({
          name: `${firstName} ${lastName}`,
          email: email,
          phone: normalizedPhone
        });

        currentOrderId = order.id;

        /*
         * 2. Créer la facture E-Billing
         */
        showMessage(
          "Création de la facture sécurisée...",
          "info"
        );

        const invoice = await createInvoice(order.id);

        /*
         * 3. Vérifier l'URL de paiement
         */
        if (!invoice.payment_url) {
          console.error("Réponse E-Billing :", invoice);

          throw new Error(
            "La facture a été créée, mais aucune URL de paiement n'a été retournée."
          );
        }

        /*
         * 4. Afficher les détails de la commande
         */
        const details = document.getElementById("details");
        details.classList.remove("hidden");
        details.textContent =
          `Commande : ${order.id}\n` +
          `Facture : ${invoice.bill_id || "créée"}\n` +
          `Montant : ${formatPrice(order.amount)}`;

        showMessage(
          `
            <strong>Facture créée avec succès.</strong><br><br>
            Redirection vers le portail sécurisé E-Billing...
          `,
          "info"
        );

        button.innerHTML =
          '<span class="spinner"></span>Redirection...';

        /*
         * 5. Redirection sans imposer d'opérateur.
         */
        window.location.href = invoice.payment_url;

      } catch (error) {
        console.error("Erreur paiement :", error);

        button.disabled = false;
        button.innerHTML = "Payer";

        showMessage(
          error.message || "Une erreur est survenue.",
          "error"
        );
      }
    });

  /* =====================================================
     INITIALISATION
  ===================================================== */

  loadProduct();
</script>
