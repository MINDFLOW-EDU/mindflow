<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MindFlow — Paiement</title>

  <meta
    name="description"
    content="Paiement sécurisé MindFlow"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
      min-height: 100vh;
    }

    .container {
      width: min(600px, 92%);
      margin: 40px auto;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #697386;
      margin-bottom: 25px;
    }

    .product-box {
      background: #f7f8fc;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 22px;
    }

    .product-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .product-price {
      font-size: 25px;
      font-weight: 800;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d8deea;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      margin-bottom: 17px;
    }

    input:focus {
      border-color: #555;
    }

    .payment-info {
      background: #f7f8fc;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 20px;
      color: #596579;
      line-height: 1.5;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 11px;
      background: #111827;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      line-height: 1.5;
    }

    .message.info {
      display: block;
      background: #eef4ff;
      color: #174ea6;
    }

    .message.success {
      display: block;
      background: #eaf8ef;
      color: #176b37;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #a61b1b;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255,255,255,.35);
      border-top-color: white;
      border-radius: 50%;
      display: inline-block;
      animation: spin .8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .details {
      margin-top: 12px;
      font-size: 14px;
      color: #596579;
      line-height: 1.6;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="logo">
      MindFlow
    </div>

    <div class="subtitle">
      Paiement sécurisé
    </div>

    <div class="product-box">

      <div
        id="productName"
        class="product-name"
      >
        Chargement...
      </div>

      <div
        id="productPrice"
        class="product-price"
      >
        ...
      </div>

    </div>

    <form id="paymentForm">

      <label for="customerName">
        Nom complet
      </label>

      <input
        id="customerName"
        type="text"
        placeholder="Votre nom complet"
        required
      >

      <label for="customerEmail">
        Adresse e-mail
      </label>

      <input
        id="customerEmail"
        type="email"
        placeholder="vous@example.com"
        required
      >

      <label for="customerPhone">
        Numéro Mobile Money
      </label>

      <input
        id="customerPhone"
        type="tel"
        placeholder="Ex. 074509021"
        required
      >

      <div class="payment-info">
        <strong>Mode de paiement</strong><br><br>
        Après avoir continué, vous serez redirigé vers
        la plateforme sécurisée E-Billing pour choisir
        votre moyen de paiement, notamment Airtel Money
        ou Moov Money.
      </div>

      <button
        id="payButton"
        type="submit"
      >
        Continuer vers le paiement
      </button>

    </form>

    <div
      id="message"
      class="message"
    ></div>

    <div
      id="details"
      class="details hidden"
    ></div>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://ejjmluesrrrbktgstlqm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_cZFXtvFhhdnwip0SDDJArg_ofylyowI";


/*
 * FONCTION SUPABASE EDGE
 *
 * Cette fonction :
 * 1. récupère la commande
 * 2. crée la facture E-Billing
 * 3. retourne payment_url
 */
const CREATE_INVOICE_FUNCTION =
  `${SUPABASE_URL}/functions/v1/create-ebilling-payment`;


let currentProduct = null;
let currentOrderId = null;


/* =========================================================
   UTILITAIRES
========================================================= */

function showMessage(text, type = "info") {

  const box =
    document.getElementById("message");

  box.className =
    `message ${type}`;

  box.innerHTML = text;
}


function formatPrice(value) {

  const amount =
    Number(value || 0);

  return new Intl.NumberFormat(
    "fr-FR"
  ).format(amount) + " FCFA";
}


function normalizePhone(phone) {

  let value =
    String(phone || "")
      .trim()
      .replace(/[^\d+]/g, "");

  if (value.startsWith("+241")) {
    value = "0" + value.slice(4);
  }

  if (value.startsWith("241")) {
    value = "0" + value.slice(3);
  }

  return value;
}


/* =========================================================
   GESTION DU RETOUR E-BILLING
========================================================= */

function handlePaymentReturn() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const payment =
    params.get("payment");

  if (payment === "success") {

    showMessage(
      `
      <strong>Paiement terminé.</strong><br><br>
      Votre paiement a été transmis avec succès.
      La confirmation définitive sera effectuée
      automatiquement par MindFlow.
      `,
      "success"
    );

    document.getElementById(
      "details"
    ).classList.remove("hidden");

    document.getElementById(
      "details"
    ).innerHTML =
      `
      Retour du portail E-Billing : paiement terminé.
      `;

    return true;
  }

  if (payment === "failed") {

    showMessage(
      `
      <strong>Paiement non finalisé.</strong><br><br>
      Le paiement n'a pas été finalisé.
      Vous pouvez recommencer.
      `,
      "error"
    );

    return true;
  }

  return false;
}


/* =========================================================
   CHARGEMENT PRODUIT
========================================================= */

async function loadProduct() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const productId =
    params.get("id");

  /*
   * Après le retour E-Billing, il est possible
   * que l'URL ne contienne plus id.
   *
   * Dans ce cas, on ne bloque pas l'affichage
   * du message de retour.
   */
  if (!productId) {

    const returned =
      handlePaymentReturn();

    if (!returned) {

      showMessage(
        "Produit introuvable.",
        "error"
      );
    }

    return;
  }

  try {

    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/products?id=eq.${encodeURIComponent(productId)}&select=*`,
        {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization:
              `Bearer ${SUPABASE_KEY}`
          }
        }
      );

    if (!response.ok) {

      throw new Error(
        "Impossible de charger le produit."
      );
    }

    const products =
      await response.json();

    if (!products.length) {

      throw new Error(
        "Produit introuvable."
      );
    }

    currentProduct =
      products[0];

    document.getElementById(
      "productName"
    ).textContent =
      currentProduct.name ||
      currentProduct.title ||
      "Produit MindFlow";

    document.getElementById(
      "productPrice"
    ).textContent =
      formatPrice(
        currentProduct.price
      );

    /*
     * Vérifier aussi si nous sommes revenus
     * d'E-Billing avec un statut.
     */
    handlePaymentReturn();

  } catch (error) {

    console.error(error);

    showMessage(
      error.message ||
      "Erreur lors du chargement du produit.",
      "error"
    );
  }
}


/* =========================================================
   CREATION COMMANDE
========================================================= */

async function createOrder(customerData) {

  const orderId =
    crypto.randomUUID();

  const order = {

    id:
      orderId,

    product_id:
      currentProduct.id,

    customer_name:
      customerData.name,

    customer_email:
      customerData.email,

    customer_phone:
      customerData.phone,

    amount:
      Number(currentProduct.price),

    status:
      "pending"
  };

  const response =
    await fetch(
      `${SUPABASE_URL}/rest/v1/orders`,
      {
        method: "POST",

        headers: {

          "Content-Type":
            "application/json",

          apikey:
            SUPABASE_KEY,

          Authorization:
            `Bearer ${SUPABASE_KEY}`,

          Prefer:
            "return=minimal"
        },

        body:
          JSON.stringify(order)
      }
    );

  if (!response.ok) {

    const text =
      await response.text();

    throw new Error(
      `Impossible de créer la commande : ${text}`
    );
  }

  return order;
}


/* =========================================================
   CREATION FACTURE E-BILLING
========================================================= */

async function createInvoice(orderId) {

  const response =
    await fetch(
      CREATE_INVOICE_FUNCTION,
      {
        method: "POST",

        headers: {

          "Content-Type":
            "application/json",

          apikey:
            SUPABASE_KEY,

          Authorization:
            `Bearer ${SUPABASE_KEY}`
        },

        body:
          JSON.stringify({
            order_id:
              orderId
          })
      }
    );

  const text =
    await response.text();

  let data;

  try {

    data =
      JSON.parse(text);

  } catch {

    data = {
      raw: text
    };
  }

  if (
    !response.ok ||
    !data.success
  ) {

    console.error(
      "Erreur création facture :",
      data
    );

    throw new Error(
      data.message ||
      data.error ||
      "Impossible de créer la facture E-Billing."
    );
  }

  return data;
}


/* =========================================================
   FORMULAIRE
========================================================= */

document
  .getElementById("paymentForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      if (!currentProduct) {

        showMessage(
          "Le produit n'est pas encore chargé.",
          "error"
        );

        return;
      }


      const button =
        document.getElementById(
          "payButton"
        );


      const name =
        document.getElementById(
          "customerName"
        ).value.trim();


      const email =
        document.getElementById(
          "customerEmail"
        ).value.trim();


      const phone =
        document.getElementById(
          "customerPhone"
        ).value.trim();


      if (
        !name ||
        !email ||
        !phone
      ) {

        showMessage(
          "Veuillez remplir tous les champs.",
          "error"
        );

        return;
      }


      const normalizedPhone =
        normalizePhone(phone);


      if (
        !/^0\d{8}$/.test(
          normalizedPhone
        )
      ) {

        showMessage(
          "Veuillez entrer un numéro Mobile Money gabonais valide.",
          "error"
        );

        return;
      }


      try {

        button.disabled = true;

        button.innerHTML =
          `
          <span class="spinner"></span>
          Préparation du paiement...
          `;


        showMessage(
          "Création de votre commande...",
          "info"
        );


        /*
         * 1. CREATION COMMANDE
         */

        const order =
          await createOrder({

            name:

              name,

            email:

              email,

            phone:

              normalizedPhone

          });


        currentOrderId =
          order.id;


        /*
         * 2. CREATION FACTURE E-BILLING
         */

        showMessage(
          "Création de la facture sécurisée...",
          "info"
        );


        const invoice =
          await createInvoice(
            order.id
          );


        /*
         * 3. VERIFIER L'URL DE PAIEMENT
         */

        if (
          !invoice.payment_url
        ) {

          console.error(
            "Réponse E-Billing :",
            invoice
          );

          throw new Error(
            "La facture a été créée, mais aucune URL de paiement n'a été retournée."
          );
        }


        /*
         * 4. AFFICHER LES INFORMATIONS
         * AVANT LA REDIRECTION
         */

        document.getElementById(
          "details"
        ).classList.remove("hidden");


        document.getElementById(
          "details"
        ).innerHTML =
          `
          Commande : ${order.id}<br>
          Facture : ${invoice.bill_id || "créée"}<br>
          Montant : ${formatPrice(order.amount)}
          `;


        showMessage(
          `
          <strong>Facture créée avec succès.</strong><br><br>
          Redirection vers le portail sécurisé
          E-Billing...
          `,
          "info"
        );


        button.innerHTML =
          `
          <span class="spinner"></span>
          Redirection...
          `;


        /*
         * 5. REDIRECTION VERS E-BILLING
         *
         * IMPORTANT :
         * aucun opérateur n'est envoyé ici.
         *
         * E-Billing affichera son propre choix :
         * Airtel Money / Moov Money.
         */

        setTimeout(() => {

          window.location.href =
            invoice.payment_url;

        }, 700);


      } catch (error) {

        console.error(
          "Erreur paiement :",
          error
        );

        button.disabled = false;

        button.innerHTML =
          "Continuer vers le paiement";


        showMessage(
          error.message ||
          "Une erreur est survenue.",
          "error"
        );
      }
    }
  );


/* =========================================================
   INITIALISATION
========================================================= */

loadProduct();

</script>

</body>
  </html>
