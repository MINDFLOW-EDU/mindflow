<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MindFlow — Paiement</title>

  <meta
    name="description"
    content="Paiement sécurisé MindFlow"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
      min-height: 100vh;
    }

    .container {
      width: min(600px, 92%);
      margin: 40px auto;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #697386;
      margin-bottom: 25px;
    }

    .product-box {
      background: #f7f8fc;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 22px;
    }

    .product-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .product-price {
      font-size: 25px;
      font-weight: 800;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d8deea;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      margin-bottom: 17px;
    }

    input:focus {
      border-color: #555;
    }

    .payment-title {
      font-weight: 700;
      margin-bottom: 12px;
    }

    .methods {
      display: grid;
      gap: 10px;
      margin-bottom: 20px;
    }

    .method {
      border: 1px solid #d8deea;
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
    }

    .method input {
      width: auto;
      margin: 0;
    }

    .method.active {
      border-color: #111;
      background: #f7f7f7;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 11px;
      background: #111827;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      line-height: 1.5;
    }

    .message.info {
      display: block;
      background: #eef4ff;
      color: #174ea6;
    }

    .message.success {
      display: block;
      background: #eaf8ef;
      color: #176b37;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #a61b1b;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255,255,255,.35);
      border-top-color: white;
      border-radius: 50%;
      display: inline-block;
      animation: spin .8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .details {
      margin-top: 12px;
      font-size: 14px;
      color: #596579;
      line-height: 1.6;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="logo">
      MindFlow
    </div>

    <div class="subtitle">
      Paiement sécurisé
    </div>

    <div class="product-box">

      <div
        id="productName"
        class="product-name"
      >
        Chargement...
      </div>

      <div
        id="productPrice"
        class="product-price"
      >
        ...
      </div>

    </div>

    <form id="paymentForm">

      <label for="customerName">
        Nom complet
      </label>

      <input
        id="customerName"
        type="text"
        placeholder="Votre nom complet"
        required
      >

      <label for="customerEmail">
        Adresse e-mail
      </label>

      <input
        id="customerEmail"
        type="email"
        placeholder="vous@example.com"
        required
      >

      <label for="customerPhone">
        Numéro Mobile Money
      </label>

      <input
        id="customerPhone"
        type="tel"
        placeholder="Ex. 074509021"
        required
      >

      <div class="payment-title">
        Moyen de paiement
      </div>

      <div class="methods">

        <label class="method active">
          <input
            type="radio"
            name="paymentMethod"
            value="airtelmoney"
            checked
          >

          <span>
            Airtel Money
          </span>
        </label>

        <label class="method">
          <input
            type="radio"
            name="paymentMethod"
            value="moovmoney4"
          >

          <span>
            Moov Money
          </span>
        </label>

      </div>

      <button
        id="payButton"
        type="submit"
      >
        Payer maintenant
      </button>

    </form>

    <div
      id="message"
      class="message"
    ></div>

    <div
      id="details"
      class="details hidden"
    ></div>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://ejjmluesrrrbktgstlqm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_cZFXtvFhhdnwip0SDDJArg_ofylyowI";


/*
 * FONCTIONS SUPABASE EDGE
 */

const CREATE_INVOICE_FUNCTION =
  `${SUPABASE_URL}/functions/v1/create-ebilling-payment`;

const START_USSD_FUNCTION =
  `${SUPABASE_URL}/functions/v1/create-ebilling-ussd`;

const CHECK_USSD_FUNCTION =
  `${SUPABASE_URL}/functions/v1/check-ebilling-payment`;


let currentProduct = null;
let currentOrderId = null;
let currentPushId = null;

let paymentCheckTimer = null;


/* =========================================================
   UTILITAIRES
========================================================= */

function showMessage(text, type = "info") {

  const box =
    document.getElementById("message");

  box.className =
    `message ${type}`;

  box.innerHTML = text;
}


function formatPrice(value) {

  const amount =
    Number(value || 0);

  return new Intl.NumberFormat(
    "fr-FR"
  ).format(amount) + " FCFA";
}


function normalizePhone(phone) {

  let value =
    String(phone || "")
      .trim()
      .replace(/[^\d+]/g, "");

  if (value.startsWith("+241")) {
    value = "0" + value.slice(4);
  }

  if (value.startsWith("241")) {
    value = "0" + value.slice(3);
  }

  return value;
}


/* =========================================================
   CHARGEMENT PRODUIT
========================================================= */

async function loadProduct() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const productId =
    params.get("id");

  if (!productId) {

    showMessage(
      "Produit introuvable.",
      "error"
    );

    return;
  }

  try {

    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/products?id=eq.${encodeURIComponent(productId)}&select=*`,
        {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization:
              `Bearer ${SUPABASE_KEY}`
          }
        }
      );

    if (!response.ok) {
      throw new Error(
        "Impossible de charger le produit."
      );
    }

    const products =
      await response.json();

    if (!products.length) {
      throw new Error(
        "Produit introuvable."
      );
    }

    currentProduct =
      products[0];

    document.getElementById(
      "productName"
    ).textContent =
      currentProduct.name ||
      currentProduct.title ||
      "Produit MindFlow";

    document.getElementById(
      "productPrice"
    ).textContent =
      formatPrice(
        currentProduct.price
      );

  } catch (error) {

    console.error(error);

    showMessage(
      error.message ||
      "Erreur lors du chargement du produit.",
      "error"
    );
  }
}


/* =========================================================
   CREATION COMMANDE
========================================================= */

async function createOrder(customerData) {

  const orderId =
    crypto.randomUUID();

  const order = {

    id: orderId,

    product_id:
      currentProduct.id,

    customer_name:
      customerData.name,

    customer_email:
      customerData.email,

    customer_phone:
      customerData.phone,

    amount:
      Number(currentProduct.price),

    status:
      "pending"
  };

  const response =
    await fetch(
      `${SUPABASE_URL}/rest/v1/orders`,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json",

          apikey:
            SUPABASE_KEY,

          Authorization:
            `Bearer ${SUPABASE_KEY}`,

          Prefer:
            "return=minimal"
        },

        body:
          JSON.stringify(order)
      }
    );

  if (!response.ok) {

    const text =
      await response.text();

    throw new Error(
      `Impossible de créer la commande : ${text}`
    );
  }

  return order;
}


/* =========================================================
   CREATION FACTURE E-BILLING
========================================================= */

async function createInvoice(orderId) {

  const response =
    await fetch(
      CREATE_INVOICE_FUNCTION,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json",

          apikey:
            SUPABASE_KEY,

          Authorization:
            `Bearer ${SUPABASE_KEY}`
        },

        body:
          JSON.stringify({
            order_id: orderId
          })
      }
    );

  const data =
    await response.json();

  if (!response.ok ||
      !data.success) {

    console.error(
      "Erreur création facture :",
      data
    );

    throw new Error(
      data.message ||
      data.error ||
      "Impossible de créer la facture E-Billing."
    );
  }

  return data;
}


/* =========================================================
   USSD PUSH
========================================================= */

async function startUssdPayment(
  orderId,
  paymentMethod
) {

  const response =
    await fetch(
      START_USSD_FUNCTION,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json",

          apikey:
            SUPABASE_KEY,

          Authorization:
            `Bearer ${SUPABASE_KEY}`
        },

        body:
          JSON.stringify({

            order_id:
              orderId,

            payment_method:
              paymentMethod

          })
      }
    );

  const data =
    await response.json();

  if (!response.ok ||
      !data.success) {

    console.error(
      "Erreur USSD Push :",
      data
    );

    throw new Error(
      data.message ||
      data.error ||
      "Impossible d'envoyer le USSD Push."
    );
  }

  return data;
}


/* =========================================================
   VERIFICATION DU PAIEMENT
========================================================= */

async function checkPayment() {

  if (!currentOrderId) {
    return;
  }

  try {

    const response =
      await fetch(
        CHECK_USSD_FUNCTION,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            apikey:
              SUPABASE_KEY,

            Authorization:
              `Bearer ${SUPABASE_KEY}`
          },

          body:
            JSON.stringify({
              order_id:
                currentOrderId
            })
        }
      );

    const data =
      await response.json();

    if (!response.ok ||
        !data.success) {

      console.error(
        "Erreur vérification :",
        data
      );

      return;
    }

    console.log(
      "État paiement :",
      data
    );


    /*
     * PAIEMENT CONFIRMÉ
     */

    const paymentStatus =
      String(
        data.status ||
        data.payment_state ||
        ""
      ).toLowerCase();

    const successfulStates = [
      "paid",
      "success",
      "successful"
    ];

    if (
      successfulStates.includes(
        paymentStatus
      )
    ) {

      stopPaymentPolling();

      const button =
        document.getElementById(
          "payButton"
        );

      button.disabled = false;

      button.innerHTML =
        "Paiement confirmé";


      showMessage(
        `
        <strong>Paiement confirmé !</strong><br><br>
        Votre paiement a bien été reçu.
        `,
        "success"
      );


      document.getElementById(
        "details"
      ).classList.remove("hidden");


      document.getElementById(
        "details"
      ).innerHTML = `
        Commande : ${currentOrderId}<br>
        Facture : ${data.bill_id || "—"}<br>
        USSD Push : ${data.ussd_push_id || currentPushId || "—"}<br>
        Statut : payé
      `;

      return;
    }


    /*
     * PAIEMENT ÉCHOUÉ
     */

    const failedStates = [
      "failed",
      "failure",
      "cancelled",
      "canceled",
      "rejected",
      "declined"
    ];

    if (
      failedStates.includes(
        paymentStatus
      )
    ) {

      stopPaymentPolling();

      const button =
        document.getElementById(
          "payButton"
        );

      button.disabled = false;

      button.innerHTML =
        "Payer maintenant";


      showMessage(
        `
        Le paiement n'a pas pu être confirmé.<br><br>
        Vous pouvez réessayer.
        `,
        "error"
      );

      return;
    }


    /*
     * PAIEMENT TOUJOURS EN ATTENTE
     */

    showMessage(
      `
      <strong>Paiement en attente...</strong><br><br>
      Validez la demande sur votre téléphone.
      Nous vérifions automatiquement le paiement.
      `,
      "info"
    );

  } catch (error) {

    console.error(
      "Erreur de vérification :",
      error
    );
  }
}


/* =========================================================
   POLLING
========================================================= */

function startPaymentPolling() {

  stopPaymentPolling();

  checkPayment();

  paymentCheckTimer =
    setInterval(
      checkPayment,
      5000
    );
}


function stopPaymentPolling() {

  if (paymentCheckTimer) {

    clearInterval(
      paymentCheckTimer
    );

    paymentCheckTimer =
      null;
  }
}


/* =========================================================
   FORMULAIRE
========================================================= */

document
  .getElementById("paymentForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      if (!currentProduct) {

        showMessage(
          "Le produit n'est pas encore chargé.",
          "error"
        );

        return;
      }


      const button =
        document.getElementById(
          "payButton"
        );


      const name =
        document.getElementById(
          "customerName"
        ).value.trim();


      const email =
        document.getElementById(
          "customerEmail"
        ).value.trim();


      const phone =
        document.getElementById(
          "customerPhone"
        ).value.trim();


      const paymentMethod =
        document.querySelector(
          'input[name="paymentMethod"]:checked'
        )?.value;


      if (
        !name ||
        !email ||
        !phone ||
        !paymentMethod
      ) {

        showMessage(
          "Veuillez remplir tous les champs.",
          "error"
        );

        return;
      }


      const normalizedPhone =
        normalizePhone(phone);


      if (
        !/^0\d{8}$/.test(
          normalizedPhone
        )
      ) {

        showMessage(
          "Veuillez entrer un numéro Mobile Money gabonais valide.",
          "error"
        );

        return;
      }


      try {

        button.disabled = true;

        button.innerHTML =
          `
          <span class="spinner"></span>
          Préparation du paiement...
          `;


        showMessage(
          "Création de votre commande...",
          "info"
        );


        /*
         * 1. CREATION COMMANDE
         */

        const order =
          await createOrder({

            name,

            email,

            phone:
              normalizedPhone

          });


        currentOrderId =
          order.id;


        /*
         * 2. CREATION FACTURE
         */

        showMessage(
          "Création de la facture sécurisée...",
          "info"
        );


        const invoice =
          await createInvoice(
            order.id
          );


        /*
         * 3. USSD PUSH
         */

        showMessage(
          `
          <strong>Facture créée.</strong><br><br>

          Préparation de votre paiement
          ${
            paymentMethod === "airtelmoney"
              ? "Airtel Money"
              : "Moov Money"
          }...
          `,
          "info"
        );


        const push =
          await startUssdPayment(
            order.id,
            paymentMethod
          );


        currentPushId =
          push?.ussd_push_id ||
          push?.ussd_push?.id ||
          null;


        if (!currentPushId) {

          throw new Error(
            "E-Billing n'a pas retourné l'identifiant du USSD Push."
          );
        }


        /*
         * 4. DEMANDE DE VALIDATION
         */

        showMessage(
          `
          <strong>Demande de paiement envoyée.</strong><br><br>

          Vérifiez votre téléphone
          et validez la demande
          ${
            paymentMethod === "airtelmoney"
              ? "Airtel Money"
              : "Moov Money"
          }.

          <br><br>

          Nous vérifions automatiquement
          votre paiement...
          `,
          "info"
        );


        document.getElementById(
          "details"
        ).classList.remove("hidden");


        document.getElementById(
          "details"
        ).innerHTML = `
          Commande : ${order.id}<br>
          Facture : ${invoice.bill_id || "créée"}<br>
          USSD Push : ${currentPushId}<br>
          Opérateur :
          ${
            paymentMethod === "airtelmoney"
              ? "Airtel Money"
              : "Moov Money"
          }
        `;


        button.innerHTML =
          "Paiement en attente...";


        /*
         * 5. VERIFICATION AUTOMATIQUE
         */

        startPaymentPolling();


      } catch (error) {

        console.error(error);

        stopPaymentPolling();

        button.disabled = false;

        button.innerHTML =
          "Payer maintenant";


        showMessage(
          error.message ||
          "Une erreur est survenue.",
          "error"
        );
      }
    }
  );


/* =========================================================
   STYLE DES MOYENS DE PAIEMENT
========================================================= */

document
  .querySelectorAll(
    'input[name="paymentMethod"]'
  )
  .forEach(
    radio => {

      radio.addEventListener(
        "change",
        () => {

          document
            .querySelectorAll(
              ".method"
            )
            .forEach(
              element =>
                element.classList.remove(
                  "active"
                )
            );

          radio
            .closest(".method")
            ?.classList.add(
              "active"
            );
        }
      );

    }
  );


/* =========================================================
   INITIALISATION
========================================================= */

loadProduct();

</script>

</body>
</html>
