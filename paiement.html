
<script>
"use strict";

/* =========================================
   CONFIGURATION MINDFLOW / SUPABASE
========================================= */

const SUPABASE_URL =
  "https://ejjmluesrrrbktgstlqm.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_cZFXtvFhhdnwip0SDDJArg_ofylyowI";

const CREATE_INVOICE_FUNCTION =
  `${SUPABASE_URL}/functions/v1/create-ebilling-payment`;

/* =========================================
   ÉTAT DE LA PAGE
========================================= */

let currentProduct = null;
let currentOrderId = null;
let selectedPaymentMethod = "mobile_money";

const params = new URLSearchParams(window.location.search);

/* =========================================
   AFFICHAGE DES MESSAGES
========================================= */

function showMessage(text, type = "info") {
  const message = document.getElementById("message");
  if (!message) return;

  message.textContent = text;
  message.className = `message ${type}`;
  message.style.display = "block";
}

function formatPrice(value) {
  const amount = Number(value);

  if (!Number.isFinite(amount)) return "Prix indisponible";

  return new Intl.NumberFormat("fr-FR", {
    maximumFractionDigits: 0
  }).format(amount) + " FCFA";
}

function normalizePhone(value) {
  let phone = String(value || "").replace(/\D/g, "");

  if (phone.startsWith("241")) {
    phone = phone.slice(3);
  }

  if (phone.length === 8) {
    phone = "0" + phone;
  }

  return phone;
}

async function readResponse(response) {
  const text = await response.text();

  try {
    return text ? JSON.parse(text) : {};
  } catch {
    return { message: text };
  }
}

/* =========================================
   RETOUR DEPUIS E-BILLING
========================================= */

function handlePaymentReturn() {
  const payment = params.get("payment");

  if (payment === "failed") {
    showMessage(
      "Le paiement n'a pas abouti. Tu peux réessayer.",
      "error"
    );
    return true;
  }

  if (payment === "success") {
    /*
      IMPORTANT :
      Le paramètre URL ne prouve pas que le paiement
      a été effectué. La confirmation définitive
      doit venir du callback E-Billing côté serveur.
    */
    showMessage(
      "Retour de paiement reçu. MindFlow attend la confirmation définitive du serveur. Ne ferme pas cette page si la vérification est encore en cours.",
      "info"
    );
    return true;
  }

  return false;
}

/* =========================================
   CHARGEMENT DU PRODUIT
========================================= */

async function loadProduct() {
  const productId = params.get("id");

  if (!productId) {
    if (!handlePaymentReturn()) {
      showMessage(
        "Produit introuvable. Retourne au catalogue et sélectionne un produit.",
        "error"
      );
    }
    return;
  }

  try {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/products?id=eq.${encodeURIComponent(productId)}&select=*`,
      {
        method: "GET",
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          "Accept": "application/json"
        }
      }
    );

    const products = await readResponse(response);

    if (!response.ok) {
      throw new Error(
        products.message || "Impossible de charger le produit."
      );
    }

    if (!Array.isArray(products) || products.length === 0) {
      showMessage(
        "Ce produit n'existe pas ou n'est pas disponible.",
        "error"
      );
      return;
    }

    currentProduct = products[0];

    const productName =
      document.getElementById("productName");
    const productDescription =
      document.getElementById("productDescription");
    const productPrice =
      document.getElementById("productPrice");
    const productCategory =
      document.getElementById("productCategory");

    if (productName) {
      productName.textContent =
        currentProduct.name ||
        currentProduct.title ||
        "Produit MindFlow";
    }

    if (productDescription) {
      productDescription.textContent =
        currentProduct.description ||
        "Contenu numérique MindFlow.";
    }

    if (productPrice) {
      productPrice.textContent =
        formatPrice(currentProduct.price);
    }

    if (productCategory) {
      productCategory.textContent =
        currentProduct.category || "MindFlow";
    }

    handlePaymentReturn();

  } catch (error) {
    console.error("Erreur de chargement du produit :", error);

    showMessage(
      error.message ||
      "Une erreur est survenue pendant le chargement du produit.",
      "error"
    );
  }
}

/* =========================================
   CRÉATION DE LA COMMANDE
========================================= */

async function createOrder(customerData) {
  const orderId = crypto.randomUUID();

  const order = {
    id: orderId,
    product_id: currentProduct.id,
    customer_name:
      `${customerData.firstName} ${customerData.lastName}`.trim(),
    customer_email: customerData.email,
    customer_phone: customerData.phone,
    amount: Number(currentProduct.price),
    status: "pending"
  };

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/orders`,
    {
      method: "POST",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify(order)
    }
  );

  if (!response.ok) {
    const errorData = await readResponse(response);

    console.error("Erreur de création de commande:", errorData);

    throw new Error(
      errorData.message ||
      "Impossible de créer la commande. Vérifie les règles d'accès Supabase (RLS)."
    );
  }

  currentOrderId = orderId;
  return orderId;
}

/* =========================================
   CRÉATION DE LA FACTURE E-BILLING
========================================= */

async function createInvoice(orderId) {
  const response = await fetch(CREATE_INVOICE_FUNCTION, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
      "Accept": "application/json"
    },
    body: JSON.stringify({
      order_id: orderId
    })
  });

  const data = await readResponse(response);

  if (!response.ok) {
    console.error("Erreur E-Billing:", data);

    throw new Error(
      data.error ||
      data.message ||
      "La facture n'a pas pu être créée."
    );
  }

  if (data.success === false) {
    throw new Error(
      data.error ||
      data.message ||
      "E-Billing n'a pas confirmé la création de la facture."
    );
  }

  if (!data.payment_url) {
    console.error("Réponse E-Billing sans payment_url:", data);

    throw new Error(
      "La facture a peut-être été créée, mais aucune URL de paiement n'a été retournée."
    );
  }

  return data;
}

/* =========================================
   CHOIX DU MODE DE PAIEMENT
========================================= */

const mobileMoneyOption =
  document.getElementById("mobileMoneyOption");

const cardOption =
  document.getElementById("cardOption");

if (mobileMoneyOption) {
  mobileMoneyOption.addEventListener("click", () => {
    selectedPaymentMethod = "mobile_money";

    mobileMoneyOption.classList.add("active");

    if (cardOption) {
      cardOption.classList.remove("active");
    }

    const radio =
      mobileMoneyOption.querySelector('input[type="radio"]');

    if (radio) radio.checked = true;
  });
}

if (cardOption) {
  cardOption.addEventListener("click", (event) => {
    const radio =
      cardOption.querySelector('input[type="radio"]');

    if (radio && radio.disabled) {
      event.preventDefault();

      showMessage(
        "Le paiement par carte bancaire n'est pas encore disponible.",
        "info"
      );
      return;
    }

    selectedPaymentMethod = "card";

    cardOption.classList.add("active");

    if (mobileMoneyOption) {
      mobileMoneyOption.classList.remove("active");
    }

    if (radio) radio.checked = true;
  });
}

/* =========================================
   VALIDATION ET LANCEMENT DU PAIEMENT
========================================= */

const paymentForm = document.getElementById("paymentForm");
const payButton = document.getElementById("payButton");

if (paymentForm) {
  paymentForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    if (!currentProduct) {
      showMessage(
        "Le produit n'est pas encore chargé. Réessaie dans quelques instants.",
        "error"
      );
      return;
    }

    if (selectedPaymentMethod !== "mobile_money") {
      showMessage(
        "Ce mode de paiement n'est pas encore disponible.",
        "error"
      );
      return;
    }

    const firstName =
      document.getElementById("customerFirstName")?.value.trim() || "";

    const lastName =
      document.getElementById("customerLastName")?.value.trim() || "";

    const email =
      document.getElementById("customerEmail")?.value.trim() || "";

    const phoneInput =
      document.getElementById("customerPhone")?.value.trim() || "";

    const phone = normalizePhone(phoneInput);

    if (!firstName || !lastName || !email || !phoneInput) {
      showMessage(
        "Remplis tous les champs avant de continuer.",
        "error"
      );
      return;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showMessage(
        "Saisis une adresse e-mail valide.",
        "error"
      );
      return;
    }

    if (!/^0\d{8}$/.test(phone)) {
      showMessage(
        "Saisis un numéro gabonais valide avec 8 chiffres, avec ou sans l'indicatif +241.",
        "error"
      );
      return;
    }

    if (payButton) {
      payButton.disabled = true;
      payButton.textContent = "Préparation du paiement...";
    }

    try {
      showMessage(
        "Création de ta commande...",
        "info"
      );

      const orderId = await createOrder({
        firstName,
        lastName,
        email,
        phone
      });

      showMessage(
        "Commande créée. Préparation de la facture...",
        "info"
      );

      const invoice = await createInvoice(orderId);

      const details = document.getElementById("details");

      if (details) {
        details.textContent =
          `Référence de commande : ${orderId}`;
        details.style.display = "block";
      }

      showMessage(
        "Facture créée. Redirection vers la page sécurisée de paiement...",
        "success"
      );

      /*
        On redirige vers l'URL fournie par le serveur.
        La confirmation du paiement sera faite côté serveur
        par le callback E-Billing, pas par cette page.
      */
      window.location.assign(invoice.payment_url);

    } catch (error) {
      console.error("Erreur pendant le paiement :", error);

      showMessage(
        error.message ||
        "Une erreur est survenue. Vérifie ta connexion puis réessaie.",
        "error"
      );

      if (payButton) {
        payButton.disabled = false;
        payButton.textContent = "Réessayer le paiement";
      }
    }
  });
}

/* =========================================
   DÉMARRAGE
========================================= */

loadProduct();
</script>
