<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Catalogue — MindFlow</title>

<meta
  name="description"
  content="Catalogue des ressources éducatives MindFlow."
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:#060713;

  color:white;

  line-height:1.6;
}

a{
  text-decoration:none;
  color:inherit;
}

.container{

  width:min(1180px,92%);

  margin:auto;
}

:root{

  --cyan:#18cfff;
  --blue:#397cff;
  --violet:#7655ff;
  --pink:#d92cff;

  --gradient:
    linear-gradient(
      110deg,
      #18cfff,
      #397cff 45%,
      #d92cff
    );

  --border:
    rgba(255,255,255,.09);

}

/* HEADER */

header{

  position:sticky;

  top:0;

  z-index:100;

  background:
    rgba(6,7,19,.86);

  backdrop-filter:
    blur(18px);

  border-bottom:
    1px solid var(--border);
}

.nav{

  min-height:74px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:20px;
}

.logo{

  display:flex;

  align-items:center;

  gap:9px;

  font-weight:800;

  font-size:1.3rem;
}

.logo img{

  width:40px;
  height:40px;

  object-fit:contain;
}

.logo span{

  background:var(--gradient);

  -webkit-background-clip:text;

  background-clip:text;

  color:transparent;
}

.nav-links{

  display:flex;

  gap:25px;
}

.nav-links a{

  color:#9699ad;

  font-size:.88rem;

  font-weight:600;
}

.nav-links a:hover{
  color:white;
}

.nav-button{

  padding:10px 17px;

  border-radius:10px;

  background:var(--gradient);

  font-weight:700;
}

/* HERO */

.catalogue-hero{

  padding:
    70px
    0
    45px;

  background:

    radial-gradient(
      circle at 15% 30%,
      rgba(0,204,255,.12),
      transparent 30%
    ),

    radial-gradient(
      circle at 85% 20%,
      rgba(157,43,255,.18),
      transparent 35%
    );
}

.catalogue-hero h1{

  font-size:
    clamp(
      2.5rem,
      6vw,
      4rem
    );

  line-height:1;

  letter-spacing:-3px;

  margin-bottom:15px;
}

.catalogue-hero h1 span{

  background:var(--gradient);

  -webkit-background-clip:text;

  background-clip:text;

  color:transparent;
}

.catalogue-hero p{

  color:#9699ae;

  max-width:650px;
}

/* SEARCH */

.search-box{

  margin-top:30px;

  display:flex;

  gap:10px;

  padding:8px;

  border-radius:15px;

  background:#10111f;

  border:
    1px solid var(--border);
}

.search-box input{

  flex:1;

  min-width:0;

  padding:13px;

  border:none;

  outline:none;

  background:transparent;

  color:white;
}

.search-box input::placeholder{
  color:#686c83;
}

.search-box button{

  border:none;

  border-radius:10px;

  padding:
    0 20px;

  background:var(--gradient);

  color:white;

  font-weight:700;

  cursor:pointer;
}

/* FILTERS */

.filters{

  display:flex;

  flex-wrap:wrap;

  gap:10px;

  padding:
    25px 0
    35px;
}

.filter{

  cursor:pointer;

  border:
    1px solid var(--border);

  background:#10111f;

  color:#9a9db1;

  padding:
    9px 15px;

  border-radius:999px;

  font-size:.8rem;

  font-weight:700;
}

.filter:hover,
.filter.active{

  color:white;

  background:
    rgba(104,77,255,.18);

  border-color:
    rgba(118,85,255,.4);
}

/* PRODUCTS */

.catalogue-section{

  padding-bottom:80px;
}

.products-grid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:20px;
}

.product{

  overflow:hidden;

  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      #111321,
      #0d0e1b
    );

  border:
    1px solid var(--border);

  transition:.3s;
}

.product:hover{

  transform:
    translateY(-5px);

  border-color:
    rgba(113,89,255,.35);

  box-shadow:
    0 20px 45px
    rgba(0,0,0,.25);
}

.product-image{

  height:190px;

  display:flex;

  align-items:center;

  justify-content:center;

  background:
    linear-gradient(
      135deg,
      #101c3b,
      #1d1033
    );
}

.product-image img{

  width:100%;
  height:100%;

  object-fit:cover;
}

.placeholder{

  font-size:3rem;
}

.product-content{

  padding:20px;
}

.category-name{

  color:#927eff;

  font-size:.7rem;

  font-weight:800;

  text-transform:uppercase;

  margin-bottom:7px;
}

.product h2{

  font-size:1.05rem;

  margin-bottom:7px;
}

.description{

  color:#85899f;

  font-size:.82rem;

  min-height:48px;

  margin-bottom:17px;
}

.bottom{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;
}

.price{

  font-weight:800;
}

.discover{

  border:none;

  padding:10px 14px;

  border-radius:9px;

  background:#191a2b;

  color:white;

  cursor:pointer;

  font-weight:700;
}

.discover:hover{

  background:var(--gradient);
}

/* EMPTY */

.message{

  grid-column:1/-1;

  text-align:center;

  padding:60px;

  border-radius:18px;

  border:
    1px solid var(--border);

  background:#0d0e1b;

  color:#777b91;
}

/* FOOTER */

footer{

  padding:
    35px 0;

  border-top:
    1px solid var(--border);

  background:#04050d;

  color:#777b91;

  font-size:.8rem;
}

/* RESPONSIVE */

@media(max-width:900px){

  .nav-links{
    display:none;
  }

  .products-grid{
    grid-template-columns:
      repeat(2,1fr);
  }

}

@media(max-width:560px){

  .products-grid{
    grid-template-columns:1fr;
  }

  .search-box{
    flex-direction:column;
  }

  .search-box button{
    padding:13px;
  }

}

</style>

</head>

<body>


<header>

  <div class="container nav">

    <a
      href="index.html"
      class="logo"
    >

      <img
        src="assets/logo.png"
        alt="MindFlow"
      >

      <span>
        MindFlow
      </span>

    </a>


    <div class="nav-links">

      <a href="index.html">
        Accueil
      </a>

      <a href="catalogue.html">
        Catalogue
      </a>

    </div>


    <a
      href="index.html"
      class="nav-button"
    >
      Accueil
    </a>

  </div>

</header>


<main>


<section class="catalogue-hero">

  <div class="container">

    <h1>
      Le catalogue
      <span>MindFlow.</span>
    </h1>

    <p>
      Explore les ressources éducatives disponibles,
      recherche un document ou navigue par matière.
    </p>


    <form
      class="search-box"
      id="searchForm"
    >

      <input
        id="searchInput"
        type="search"
        placeholder="Rechercher un cours, une fiche, un exercice..."
        autocomplete="off"
      >

      <button type="submit">
        Rechercher
      </button>

    </form>

  </div>

</section>


<section class="catalogue-section">

  <div class="container">


    <div class="filters">

      <button
        class="filter active"
        data-category=""
      >
        Toutes
      </button>

      <button
        class="filter"
        data-category="Mathématiques"
      >
        📐 Mathématiques
      </button>

      <button
        class="filter"
        data-category="SVT"
      >
        🧬 SVT
      </button>

      <button
        class="filter"
        data-category="Physique"
      >
        ⚛️ Physique
      </button>

      <button
        class="filter"
        data-category="Informatique"
      >
        💻 Informatique
      </button>

    </div>


    <div
      class="products-grid"
      id="productsContainer"
    >

      <div class="message">
        Chargement des ressources...
      </div>

    </div>

  </div>

</section>

</main>


<footer>

  <div class="container">

    © 2026 MindFlow —
    Apprendre autrement, progresser intelligemment.

  </div>

</footer>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://ejjmluesrrrbktgstlqm.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_cZFXtvFhhdnwip0SDDJArg_ofylyowI";


const container =
  document.getElementById(
    "productsContainer"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );

const searchForm =
  document.getElementById(
    "searchForm"
  );

let allProducts = [];

let currentCategory = "";

let currentSearch = "";


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

  if(
    value === null ||
    value === undefined
  ){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   PRICE
========================= */

function formatPrice(price){

  return Number(price)
    .toLocaleString("fr-FR")
    + " FCFA";

}


/* =========================
   LOAD
========================= */

async function loadProducts(){

  try{

    const endpoint =
      SUPABASE_URL +
      "/rest/v1/products" +
      "?select=id,title,description,price,category,product_type,image_url,is_active" +
      "&is_active=eq.true" +
      "&order=created_at.desc";


    const response =
      await fetch(
        endpoint,
        {

          headers:{

            "apikey":
              SUPABASE_PUBLISHABLE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_PUBLISHABLE_KEY

          }

        }
      );


    if(!response.ok){

      throw new Error(
        "Erreur " +
        response.status
      );

    }


    allProducts =
      await response.json();


    applyFilters();

  }

  catch(error){

    console.error(error);

    container.innerHTML = `

      <div class="message">

        Impossible de charger
        le catalogue.

      </div>

    `;

  }

}


/* =========================
   RENDER
========================= */

function renderProducts(products){

  if(
    !products ||
    products.length === 0
  ){

    container.innerHTML = `

      <div class="message">

        Aucun document ne correspond
        à ta recherche.

      </div>

    `;

    return;

  }


  container.innerHTML = "";


  products.forEach(product => {

    const card =
      document.createElement("article");

    card.className =
      "product";


    let image = `

      <div class="placeholder">
        📚
      </div>

    `;


    if(product.image_url){

      image = `

        <img
          src="${escapeHTML(product.image_url)}"
          alt="${escapeHTML(product.title)}"
          loading="lazy"
        >

      `;

    }


    card.innerHTML = `

      <div class="product-image">

        ${image}

      </div>


      <div class="product-content">

        <div class="category-name">

          ${escapeHTML(
            product.category ||
            "Ressource"
          )}

        </div>


        <h2>

          ${escapeHTML(
            product.title
          )}

        </h2>


        <p class="description">

          ${escapeHTML(
            product.description ||
            "Ressource éducative MindFlow."
          )}

        </p>


        <div class="bottom">

          <span class="price">

            ${formatPrice(
              product.price
            )}

          </span>


          <button
            class="discover"
            type="button"
          >
            Découvrir
          </button>

        </div>

      </div>

    `;


    card
      .querySelector(".discover")
      .addEventListener(
        "click",
        () => {

          window.location.href =
            "produit.html?id=" +
            encodeURIComponent(
              product.id
            );

        }
      );


    container.appendChild(card);

  });

}


/* =========================
   FILTER
========================= */

function applyFilters(){

  let filtered =
    [...allProducts];


  if(currentCategory){

    filtered =
      filtered.filter(
        product =>
          (
            product.category ||
            ""
          ).toLowerCase()
          ===
          currentCategory.toLowerCase()
      );

  }


  if(currentSearch){

    filtered =
      filtered.filter(product => {

        const title =
          (
            product.title ||
            ""
          ).toLowerCase();

        const description =
          (
            product.description ||
            ""
          ).toLowerCase();

        const category =
          (
            product.category ||
            ""
          ).toLowerCase();


        return (

          title.includes(
            currentSearch
          )

          ||

          description.includes(
            currentSearch
          )

          ||

          category.includes(
            currentSearch
          )

        );

      });

  }


  renderProducts(filtered);

}


/* =========================
   FILTER BUTTONS
========================= */

document
  .querySelectorAll(".filter")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".filter")
          .forEach(
            item =>
              item.classList.remove(
                "active"
              )
          );


        button.classList.add(
          "active"
        );


        currentCategory =
          button.dataset.category;


        applyFilters();

      }
    );

  });


/* =========================
   SEARCH
========================= */

searchForm.addEventListener(
  "submit",
  event => {

    event.preventDefault();


    currentSearch =
      searchInput.value
        .trim()
        .toLowerCase();


    applyFilters();

  }
);


/* =========================
   URL PARAMETERS
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const categoryParam =
  params.get("category");

const searchParam =
  params.get("search");


if(categoryParam){

  currentCategory =
    categoryParam;

  document
    .querySelectorAll(".filter")
    .forEach(button => {

      button.classList.remove(
        "active"
      );


      if(
        button.dataset.category
          .toLowerCase()
        ===
        categoryParam.toLowerCase()
      ){

        button.classList.add(
          "active"
        );

      }

    });

}


if(searchParam){

  currentSearch =
    searchParam.toLowerCase();

  searchInput.value =
    searchParam;

}


/* =========================
   START
========================= */

loadProducts();

</script>

</body>
  </html>
