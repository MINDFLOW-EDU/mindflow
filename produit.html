<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Produit — MindFlow</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f8fb;
      color: #111827;
      min-height: 100vh;
    }

    header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 6%;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #111827;
      text-decoration: none;
    }

    .logo span {
      color: #2563eb;
    }

    main {
      width: min(1000px, 92%);
      margin: 45px auto;
    }

    .back {
      display: inline-block;
      margin-bottom: 25px;
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    .product-box {
      background: white;
      border-radius: 22px;
      padding: 35px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.08);
    }

    .category {
      color: #2563eb;
      font-weight: 700;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 15px;
    }

    .description {
      color: #6b7280;
      line-height: 1.7;
      font-size: 17px;
      margin-bottom: 25px;
    }

    .price {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 25px;
    }

    .buy-button {
      display: inline-block;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 16px 25px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 17px;
    }

    .buy-button:hover {
      background: #1d4ed8;
    }

    .info {
      margin-top: 25px;
      padding: 16px;
      background: #eff6ff;
      color: #1e40af;
      border-radius: 12px;
      line-height: 1.5;
    }

    .loading,
    .error {
      text-align: center;
      padding: 50px 20px;
    }

    .error {
      color: #b91c1c;
    }

    @media (max-width: 600px) {

      main {
        margin: 25px auto;
      }

      .product-box {
        padding: 25px 20px;
      }

      h1 {
        font-size: 29px;
      }

    }

  </style>
</head>

<body>

<header>

  <a href="index.html" class="logo">
    Mind<span>Flow</span>
  </a>

</header>


<main>

  <a href="index.html#catalogue" class="back">
    ← Retour au catalogue
  </a>


  <div id="loading" class="loading">
    Chargement du produit...
  </div>


  <div id="error" class="error" style="display:none;">
  </div>


  <div
    id="product"
    class="product-box"
    style="display:none;"
  >

    <div
      id="category"
      class="category"
    ></div>


    <h1 id="title"></h1>


    <p
      id="description"
      class="description"
    ></p>


    <div
      id="price"
      class="price"
    ></div>


    <a
      id="buyButton"
      href="#"
      class="buy-button"
    >
      Acheter maintenant
    </a>


    <div class="info">

      🔒 Paiement sécurisé bientôt disponible
      avec <strong>E-Billing</strong> et les
      moyens de paiement mobile disponibles.

    </div>

  </div>

</main>


<script>

  const SUPABASE_URL =
    "https://ejjmluesrrrbktgstlqm.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_cZFXtvFhhdnwip0SDDJArg_ofylyowI";


  const params =
    new URLSearchParams(window.location.search);

  const productId =
    params.get("id");


  const loading =
    document.getElementById("loading");

  const errorBox =
    document.getElementById("error");

  const productBox =
    document.getElementById("product");


  async function loadProduct() {

    if (!productId) {

      loading.style.display = "none";

      errorBox.textContent =
        "Aucun produit sélectionné.";

      errorBox.style.display = "block";

      return;
    }


    try {

      const response = await fetch(

        SUPABASE_URL +
        "/rest/v1/products" +
        "?select=id,title,description,price,category" +
        "&id=eq." +
        encodeURIComponent(productId) +
        "&is_active=eq.true",

        {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization:
              "Bearer " + SUPABASE_KEY
          }
        }

      );


      if (!response.ok) {

        throw new Error(
          "Erreur Supabase"
        );

      }


      const products =
        await response.json();


      if (!products.length) {

        throw new Error(
          "Produit introuvable"
        );

      }


      const product =
        products[0];


      document.getElementById(
        "category"
      ).textContent =
        product.category;


      document.getElementById(
        "title"
      ).textContent =
        product.title;


      document.getElementById(
        "description"
      ).textContent =
        product.description || "";


      document.getElementById(
        "price"
      ).textContent =
        Number(product.price)
        .toLocaleString("fr-FR") +
        " FCFA";


      document.getElementById(
        "buyButton"
      ).href =
        "paiement.html?id=" +
        encodeURIComponent(product.id);


      loading.style.display =
        "none";

      productBox.style.display =
        "block";


    } catch (error) {

      console.error(error);

      loading.style.display =
        "none";

      errorBox.textContent =
        "Impossible de charger ce produit.";

      errorBox.style.display =
        "block";

    }

  }


  loadProduct();

</script>

</body>
</html>
